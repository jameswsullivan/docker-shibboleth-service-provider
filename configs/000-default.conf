LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_with_time

# MPM Settings :
<IfModule mpm_event_module>
    StartServers              20
    ServerLimit               50
    ThreadsPerChild          200
    ThreadLimit              200
    MaxRequestWorkers      10000

    MinSpareThreads         1500
    MaxSpareThreads         3000

    MaxConnectionsPerChild     0
    KeepAlive                Off

    #KeepAliveTimeout           2
    #MaxKeepAliveRequests      50
</IfModule>

<VirtualHost *:443>
    ServerName https://mydomain.com
    DocumentRoot /var/www/html

    #SSLEngine on
    #SSLCertificateFile /etc/certs/mycert.crt
    #SSLCertificateKeyFile /etc/certs/mycert.key

    ProxyPreserveHost On
    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto https
    RemoteIPHeader X-Forwarded-For
    #Protocols h2 h2c http/1.1

    Protocols http/1.1
    LimitRequestFieldSize 65536
    LimitRequestFields 256
    ProxyIOBufferSize 65536

    # Shibboelth Protected Paths -- BEGIN

    <IfModule mod_shib>
      UseCanonicalName On

      <Location />
        AuthType shibboleth
        ShibRequireSession Off
        Require shibboleth
      </Location>

      <Location /Shibboleth.sso>
        SetHandler shib
      </Location>

      <Location /server-status>
        AuthType shibboleth
        ShibRequireSession On
        Require shibboleth
        ShibUseHeaders On
      </Location>

      # No ProxyPass on the following paths :
      ProxyPass /Shibboleth.sso !
      ProxyPass /server-status !

    </IfModule>

    # Shibboelth Protected Paths -- END

    # ProxyPass configs -- BEGIN
    ProxyPass /mypath http://myotherdoamin.com/mypath disablereuse=On
    ProxyPassReverse /mypath http://myotherdoamin.com/mypath

    # ProxyPass configs -- END

    # ErrorLog ${APACHE_LOG_DIR}/error.log
    # CustomLog ${APACHE_LOG_DIR}/access.log combined

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined_with_time

</VirtualHost>
